# Temporary print feedback loop; all required full acceptance remains in ci.yml.
name: print-diagnostics

on:
  pull_request:

permissions: {}

concurrency:
  group: print-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  print-diagnostics:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build locked app and fixture
        shell: pwsh
        run: dotnet build MarkdownViewr.Windows.slnx -p:Platform=x64 -p:RestoreLockedMode=true -warnaserror
      - name: Run actual native print and PDF acceptance
        shell: pwsh
        run: dotnet test tests/MarkdownViewr.Windows.UiTests --no-build --filter FullyQualifiedName~Print_ --logger 'console;verbosity=normal' --logger 'trx;LogFileName=print-diagnostics.trx' --results-directory artifacts/print-diagnostics
      - name: Retain owned print fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: print-diagnostics
          path: |
            artifacts/print-diagnostics/*.trx
            artifacts/installed-smoke-*/*.pdf
            artifacts/installed-smoke-*/*.png
            artifacts/installed-smoke-*/*.log
          retention-days: 7
