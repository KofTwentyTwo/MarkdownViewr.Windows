# Temporary native source feedback loop; required full acceptance remains in ci.yml.
name: source-diagnostics

on:
  pull_request:

permissions: {}

concurrency:
  group: source-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary filtered native feedback loop; the full required UI and installed suites in ci.yml remain unchanged.
  source-diagnostics:
    name: source-diagnostics
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build locked app and fixture
        shell: pwsh
        run: dotnet build MarkdownViewr.Windows.slnx -p:Platform=x64 -p:RestoreLockedMode=true -warnaserror
      - name: Run exact source viewport feedback loop
        shell: pwsh
        run: dotnet test tests/MarkdownViewr.Windows.UiTests --no-build --filter FullyQualifiedName~Source_BidirectionalScroll_AlignsActualHeadingViewports --logger 'console;verbosity=normal' --logger 'trx;LogFileName=source-diagnostics.trx' --results-directory artifacts/source-diagnostics
      - name: Retain source diagnostic result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-diagnostics
          path: artifacts/source-diagnostics/*.trx
          retention-days: 7
